<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Settings - Switch Browser Data</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../icons/icon32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../lib/tk-base.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="tk-header">
    <span class="tk-header__home">
      <img class="tk-header__icon" src="../icons/icon.svg" alt="">
      <span class="tk-header__name">SWITCH BROWSER DATA</span>
    </span>
  </header>

  <main class="container">
    <h1 data-i18n="options_title">設定</h1>

    <section class="section">
      <h2 data-i18n="section_language">言語</h2>
      <select id="langSelect" class="lang-select">
        <option value="auto" data-i18n-option="lang_auto">ブラウザに合わせる</option>
        <option value="ja"   data-i18n-option="lang_ja">日本語</option>
        <option value="en"   data-i18n-option="lang_en">English</option>
      </select>
    </section>

    <section class="section">
      <h2 data-i18n="section_data_types">保存するデータ種別</h2>
      <div class="toggle-list">
        <label class="toggle-item">
          <span>Cookie</span>
          <input type="checkbox" id="toggleCookies">
        </label>
        <label class="toggle-item">
          <span>localStorage</span>
          <input type="checkbox" id="toggleLocalStorage">
        </label>
        <label class="toggle-item">
          <span>sessionStorage</span>
          <input type="checkbox" id="toggleSessionStorage">
        </label>
        <label class="toggle-item">
          <span>IndexedDB</span>
          <input type="checkbox" id="toggleIndexedDB">
        </label>
      </div>
    </section>

    <section class="section">
      <h2 data-i18n="section_behavior">動作</h2>
      <div class="toggle-list">
        <label class="toggle-item">
          <span data-i18n="toggle_auto_backup">読み込む前に今の状態を自動で残す</span>
          <input type="checkbox" id="toggleAutoBackup">
        </label>
        <label class="toggle-item">
          <span data-i18n="toggle_auto_reload">読み込んだ後にページを再読み込みする</span>
          <input type="checkbox" id="toggleAutoReload">
        </label>
        <label class="toggle-item">
          <span data-i18n="toggle_show_badge">アイコンに適用中のスナップショットを表示する</span>
          <input type="checkbox" id="toggleShowBadge">
        </label>
      </div>
    </section>

    <section class="section">
      <h2 data-i18n="section_snapshots">保存済みスナップショット</h2>
      <p class="hint" data-i18n="hint_snapshots">ポップアップは現在のタブのドメインを自動検出します。ここでは保存済みデータの確認と削除ができます。</p>
      <div id="domainList" class="domain-list"></div>
    </section>

    <section class="section">
      <h2 data-i18n="section_data_management">データ管理</h2>
      <div class="data-actions">
        <button id="exportBtn"  class="btn btn-secondary" data-i18n="btn_export">全データをエクスポート</button>
        <button id="importBtn"  class="btn btn-secondary" data-i18n="btn_import">データをインポート</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
        <button id="clearAllBtn" class="btn btn-danger"   data-i18n="btn_clear_all">全データを削除</button>
      </div>
    </section>

    <div id="statusMsg" class="status-msg hidden"></div>
  </main>

  <footer class="tk-footer">
    <p id="versionFooter"></p>
    <p><a href="https://tk3.biz/" target="_blank" rel="noopener">tk3.biz</a></p>
  </footer>
  <script type="module" src="options.js"></script>
</body>
</html>
