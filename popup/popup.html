<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>Switch Browser Data</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../icons/icon32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="../lib/tk-base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="tk-header">
    <span class="tk-header__home">
      <img class="tk-header__icon" src="../icons/icon.svg" alt="">
      <span class="tk-header__name">SWITCH BROWSER DATA</span>
    </span>
    <div class="tk-header__end">
      <button id="settingsBtn" class="icon-btn" type="button" data-i18n-title="btn_settings" data-i18n-aria-label="btn_settings" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3a1.7 1.7 0 0 1 3.4 0 1.7 1.7 0 0 0 2.6 1 1.7 1.7 0 0 1 2.4 2.4 1.7 1.7 0 0 0 1 2.6 1.7 1.7 0 0 1 0 3.4 1.7 1.7 0 0 0-1 2.6 1.7 1.7 0 0 1-2.4 2.4 1.7 1.7 0 0 0-2.6 1 1.7 1.7 0 0 1-3.4 0 1.7 1.7 0 0 0-2.6-1 1.7 1.7 0 0 1-2.4-2.4 1.7 1.7 0 0 0-1-2.6 1.7 1.7 0 0 1 0-3.4 1.7 1.7 0 0 0 1-2.6 1.7 1.7 0 0 1 2.4-2.4 1.7 1.7 0 0 0 2.6-1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="domain-info">
      <span class="domain-label" data-i18n="domain_label">ドメイン</span>
      <span id="currentDomain" class="domain-value" data-i18n="loading">読み込み中...</span>
    </div>

    <main id="mainContent" class="hidden">
      <div id="searchBox" class="search hidden">
        <label for="searchInput" class="tk-visually-hidden" data-i18n="search_label">スナップショットを検索</label>
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" class="search__input" autocomplete="off" spellcheck="false"
          data-i18n-placeholder="search_placeholder" placeholder="名前で絞り込み">
        <kbd class="search__key" aria-hidden="true">/</kbd>
      </div>

      <h2 id="snapshotListLabel" class="tk-visually-hidden" data-i18n="snapshot_label">スナップショット</h2>
      <ul id="snapshotList" class="snapshot-list" aria-labelledby="snapshotListLabel"></ul>

      <div id="emptyState" class="empty-state hidden">
        <p class="empty-state__title" data-i18n="empty_title">まだスナップショットはありません</p>
        <p class="empty-state__body" data-i18n="empty_body">今のログイン状態などを保存すると、ここからワンクリックで切り替えられます。</p>
      </div>
      <p id="noMatch" class="empty-state hidden" data-i18n="no_match">一致するスナップショットはありません</p>

      <div id="undoBar" class="undo-bar hidden">
        <svg class="undo-bar__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span id="undoText" class="undo-bar__text"></span>
        <button id="undoBtn" class="text-btn" type="button" data-i18n="btn_undo">戻す</button>
      </div>

      <div class="save-area">
        <button id="saveBtn" class="tk-btn save-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="btn_save_current">現在の状態を保存</span>
        </button>
        <form id="saveForm" class="save-form hidden">
          <label for="newSnapshotName" class="tk-visually-hidden" data-i18n="new_name_placeholder">スナップショット名</label>
          <input type="text" id="newSnapshotName" class="text-input" autocomplete="off"
            data-i18n-placeholder="new_name_placeholder" placeholder="スナップショット名">
          <div class="save-form__actions">
            <button id="cancelSaveBtn" class="tk-btn tk-btn--quiet" type="button" data-i18n="btn_cancel">キャンセル</button>
            <button id="confirmSaveBtn" class="tk-btn" type="submit" data-i18n="btn_save">保存</button>
          </div>
        </form>
      </div>
    </main>

    <div id="unavailableMsg" class="unavailable hidden" data-i18n="unavailable">
      このページでは使用できません
    </div>

    <div id="statusMsg" class="status-msg hidden" role="status"></div>
  </div>

  <template id="snapshotRowTemplate">
    <li class="snapshot">
      <button class="snapshot__main" type="button">
        <span class="snapshot__dot" aria-hidden="true"></span>
        <span class="snapshot__text">
          <span class="snapshot__name"></span>
          <span class="snapshot__meta"></span>
        </span>
        <span class="badge badge--active hidden"></span>
        <span class="badge badge--modified hidden"></span>
      </button>
      <kbd class="snapshot__key" aria-hidden="true"></kbd>
      <button class="icon-btn snapshot__more" type="button" aria-haspopup="menu" aria-expanded="false" command="toggle-popover">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
      <div class="row-menu" popover="auto">
        <div focusgroup="menu nomemory">
          <button type="button" data-action="overwrite"></button>
          <button type="button" data-action="rename"></button>
          <hr>
          <button type="button" data-action="delete" class="row-menu__danger"></button>
        </div>
      </div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
