name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e/fixtures.js launches Chromium with headless: false, because
      # --load-extension needs a real browser UI, so CI needs a virtual display.
      - name: E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e
